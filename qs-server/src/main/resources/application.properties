# Sign-in: users sign in through the organisation's identity provider (OpenID Connect). The API is a
# bearer-token resource server; the UI performs the login. Production sets quarkus.oidc.auth-server-url
# and quarkus.oidc.client-id for that provider; dev mode starts a Keycloak through Dev Services.
quarkus.oidc.application-type=service

# Tests use the WireMock identity provider from quarkus-test-oidc-server.
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.auth-server-url=${keycloak.url}/realms/quarkus/
%test.quarkus.oidc.client-id=quarkus-service-app
%test.quarkus.oidc.token.issuer=https://server.example.com

# Every API call needs a signed-in user.
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# Application database: saved queries, versions and the audit log (PostgreSQL, plain JDBC; Flyway owns the schema). Production sets
# quarkus.datasource.jdbc.url, username and password; dev and test start one through Dev Services.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
# Tests start from an empty application database (the Dev Services container may be reused).
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false
